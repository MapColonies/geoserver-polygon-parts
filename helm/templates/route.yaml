{{- if .Values.route.enabled -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ template "route.fullname" . }}
spec:
  path:  {{ .Values.route.path }}
  to:
    kind: Service
    name: {{ template "geoserver.fullname" . }}
  {{- $tls := .Values.route.tls }}
  {{- if kindIs "map" $tls }}{{ $tls = $tls.enabled }}{{ end }}
  {{ if $tls }}
  tls:
    termination: edge
  {{ end }}
{{- end -}}
